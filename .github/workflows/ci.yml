name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }}, fastmcp ${{ matrix.fastmcp || 'latest 3.x' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Python with the lower bound of the fastmcp pin.
          - python-version: "3.11"
            fastmcp: "3.0.0"
          # Newest Python with whatever fastmcp 3.x the pin resolves to.
          - python-version: "3.13"
            fastmcp: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Resolve the fastmcp pin in the same step so no newer fastmcp files are left behind.
      - name: Install
        env:
          FASTMCP_PIN: ${{ matrix.fastmcp }}
        run: python -m pip install -e ".[test]" ${FASTMCP_PIN:+"fastmcp==$FASTMCP_PIN"}
      - run: python -m pip show fastmcp mcp
      - run: python -m pytest -q
