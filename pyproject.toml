[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbridge"
dynamic = ["version"]
description = "Read-only authenticated MCP gateway for approved project context"
requires-python = ">=3.11"
# fastmcp 4 removed fastmcp.tools.tool and 2.x lacks tool(timeout=...); the
# gateway is tested against the 3.x line. mcp bounds follow fastmcp 3.x.
dependencies = ["fastmcp>=3.0,<4", "mcp>=1.24,<2", "anyio", "pyyaml", "starlette"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.dynamic]
version = { attr = "uga.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
