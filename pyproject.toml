[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbridge"
dynamic = ["version"]
description = "Read-only authenticated MCP gateway for approved project context"
requires-python = ">=3.11"
# fastmcp 4 removed fastmcp.tools.tool; anyio 4.1 added abandon_on_cancel.
dependencies = ["fastmcp>=3,<4", "mcp>=1.24,<2", "anyio>=4.1", "pyyaml", "starlette"]

[project.optional-dependencies]
test = ["pytest"]
docs = ["reportlab>=4.0"]

[tool.setuptools.dynamic]
version = { attr = "uga.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
