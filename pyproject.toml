[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbridge"
version = "0.2.0"
description = "Self-hosted MCP gateway for approved project context and policy-controlled computer access"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3,<4", "mcp", "anyio", "pyyaml", "starlette", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
contextbridge-computer = "contextbridge.computer.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
