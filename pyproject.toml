[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbridge"
version = "0.3.0"
description = "Self-hosted MCP gateway for approved project context and policy-controlled computer access"
requires-python = ">=3.11"
# fastmcp 4 removed fastmcp.tools.tool; anyio 4.1 added abandon_on_cancel.
dependencies = [
    "fastmcp>=3,<4",
    "mcp>=1.24,<2",
    "anyio>=4.1",
    "pyyaml",
    "starlette",
    "psutil>=5.9",
    "websockets>=13",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
contextbridge-computer = "contextbridge.computer.server:main"
contextbridge-agent = "contextbridge.remote.agent:main"
contextbridge-admin = "contextbridge.remote.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
