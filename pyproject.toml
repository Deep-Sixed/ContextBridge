[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbridge"
dynamic = ["version"]
description = "Read-only authenticated MCP gateway for approved project context"
requires-python = ">=3.11"
# The gateway hooks fastmcp 3's middleware and server internals; fastmcp 4 reworked
# that API (it also removed fastmcp.tools.tool).
dependencies = ["fastmcp>=3,<4", "mcp>=1.24,<2", "anyio>=4", "pyyaml", "starlette"]

[project.optional-dependencies]
test = ["pytest"]
docs = ["reportlab>=4.0"]

[tool.setuptools.dynamic]
version = { attr = "uga.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
